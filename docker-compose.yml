services:
  db:
    image: postgres:15
    container_name: odoo_arcgis_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${ODOO_DB_USER:-odoo}
      - POSTGRES_PASSWORD=${ODOO_DB_PASSWORD:-odoo}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  odoo:
    image: odoo:18.0
    container_name: odoo_arcgis_odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=${ODOO_DB_USER:-odoo}
      - PASSWORD=${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo/config:/etc/odoo
      - ./odoo/addons:/mnt/extra-addons
    networks:
      - backend

  integration-api:
    build:
      context: ./integration-api
    container_name: odoo_arcgis_integration_api
    restart: unless-stopped
    depends_on:
      - odoo
    env_file:
      - ./integration-api/.env
    ports:
      - "8000:8000"
    # Si ArcGIS Enterprise corre en un host cuyo nombre solo resuelve vía
    # DNS local de Windows (mDNS/LLMNR) y no desde dentro de Docker,
    # descomentar y ajustar (ver README, sección 14 - Troubleshooting):
    # extra_hosts:
    #   - "tu-host.dominio.local:host-gateway"
    networks:
      - backend

  # ── Publicación de la API para los webhooks de ArcGIS Online ──────────
  # Se elige UNA opción con COMPOSE_PROFILES en el .env de la raíz
  # (README, sección 17). Con ArcGIS Enterprise en la misma red no se usa
  # ninguna: la API se publica con IIS o Nginx.

  # Túnel rápido de Cloudflare: sin cuenta, pero la URL cambia en cada reinicio.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate --url http://integration-api:8000
    depends_on:
      - integration-api
    networks:
      - backend
    restart: unless-stopped

  # ngrok con dominio fijo: la URL no cambia (NGROK_AUTHTOKEN y NGROK_DOMAIN).
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    command: http integration-api:8000 --url=${NGROK_DOMAIN:-}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "127.0.0.1:4040:4040"     # inspector de peticiones de ngrok (solo local)
    depends_on:
      - integration-api
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  odoo-db-data:
  odoo-web-data:
